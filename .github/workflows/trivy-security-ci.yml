name: Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  trivy-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ JAVA 17 (ESTO ES LO QUE TE PIDEN AHORA)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ✅ Build igual al profesor
      - name: Build Project
        run: mvn clean compile -DskipTests

      # ✅ TRIVY ESTABLE (la versión que NO falla)
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          exit-code: "0"

      - name: Pipeline Finished
        run: echo "Trivy scan completed successfully"